<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Funeral Pictorial — Lily Monogram</title>
  <rect width="400" height="400" fill="#F7F3EC"/>
  <circle cx="200" cy="160" r="110" fill="none" stroke="#C9A961" stroke-width="2"/>
  <circle cx="200" cy="160" r="102" fill="none" stroke="#C9A961" stroke-width="0.8"/>
  <!-- monogram -->
  <text x="150" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="110" fill="#1F2A44">F</text>
  <text x="236" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-style="italic" fill="#1F2A44" opacity="0.85">P</text>
  <!-- calla lily -->
  <g transform="translate(196,96) rotate(18)">
    <path d="M0 60 C -4 40, -2 20, 0 0 C 2 20, 4 40, 0 60 Z" fill="#8FA68E"/>
    <path d="M0 10 C -16 -6, -8 -30, 6 -34 C 20 -26, 18 -4, 0 10 Z" fill="#FFFFFF" stroke="#C9A961" stroke-width="1.5"/>
    <path d="M4 -4 C 4 -14, 6 -22, 8 -28" stroke="#C9A961" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1F2A44" letter-spacing="4">FUNERAL PICTORIAL</text>
  <text x="200" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8FA68E" letter-spacing="4" font-style="italic">tribute slideshows, lovingly made</text>
</svg>
