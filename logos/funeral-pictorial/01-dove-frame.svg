  <circle cx="137" cy="97" r="1.8" fill="#F7F3EC"/>
  <!-- wordmark -->
  <text x="200" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#1F2A44" letter-spacing="1">Funeral</text>
  <text x="402" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#C9A961">Pictorial</text>
  <line x1="202" y1="124" x2="602" y2="124" stroke="#C9A961" stroke-width="1.5"/>
