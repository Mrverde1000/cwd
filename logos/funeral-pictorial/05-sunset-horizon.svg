<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <title>Funeral Pictorial — Sunset Horizon</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A74"/>
      <stop offset="55%" stop-color="#C98A6B"/>
      <stop offset="100%" stop-color="#F0C77E"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E4A6B"/>
      <stop offset="100%" stop-color="#1F2A44"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="110" cy="110" r="74"/></clipPath>
  </defs>
  <rect width="640" height="220" fill="#FFFFFF"/>
  <g clip-path="url(#circ)">
    <rect x="36" y="36" width="148" height="148" fill="url(#sky)"/>
    <circle cx="110" cy="118" r="22" fill="#FFF1C4"/>
    <rect x="36" y="118" width="148" height="66" fill="url(#sea)"/>
    <path d="M60 134 Q 110 128 160 134" stroke="#F0C77E" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M70 148 Q 110 142 150 148" stroke="#F0C77E" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- birds -->
    <path d="M78 70 q4 -4 8 0 M86 70 q4 -4 8 0" stroke="#1F2A44" stroke-width="1.5" fill="none"/>
    <path d="M128 60 q3 -3 6 0 M134 60 q3 -3 6 0" stroke="#1F2A44" stroke-width="1.3" fill="none"/>
  </g>
  <!-- photo-corner frame -->
  <circle cx="110" cy="110" r="74" fill="none" stroke="#1F2A44" stroke-width="6"/>
  <circle cx="110" cy="110" r="84" fill="none" stroke="#C9A961" stroke-width="1.5"/>
  <text x="226" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#1F2A44">Funeral Pictorial</text>
  <text x="228" y="136" font-family="Georgia, serif" font-size="15" fill="#C98A6B" letter-spacing="4" font-style="italic">every sunset tells a story</text>
</svg>
