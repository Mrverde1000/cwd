<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Funeral Pictorial — Caring Hands</title>
  <rect width="400" height="400" fill="#F7F3EC"/>
  <g transform="translate(0,-30)">
  <!-- photo -->
  <g transform="rotate(-4 200 150)">
    <rect x="150" y="96" width="100" height="112" fill="#FFFFFF" stroke="#1F2A44" stroke-width="3"/>
    <rect x="160" y="106" width="80" height="80" fill="#E7E0D1"/>
    <circle cx="200" cy="134" r="14" fill="#C9A961"/>
    <path d="M172 186 C 176 160, 224 160, 228 186 Z" fill="#C9A961"/>
  </g>
  <!-- hands, cupped beneath the photo -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left hand: cream outline then navy so fingers separate -->
    <g stroke="#F7F3EC" stroke-width="16">
      <path d="M150 262 L 176 206"/><path d="M160 268 L 192 214"/><path d="M172 272 L 206 226"/><path d="M184 274 L 214 240"/><path d="M132 246 L 152 206"/>
    </g>
    <g stroke="#1F2A44" stroke-width="10.5">
      <path d="M150 262 L 176 206"/><path d="M160 268 L 192 214"/><path d="M172 272 L 206 226"/><path d="M184 274 L 214 240"/><path d="M132 246 L 152 206"/>
    </g>
    <!-- right hand -->
    <g stroke="#F7F3EC" stroke-width="16">
      <path d="M250 262 L 224 206"/><path d="M240 268 L 208 214"/><path d="M228 272 L 194 226"/><path d="M216 274 L 186 240"/><path d="M268 246 L 248 206"/>
    </g>
    <g stroke="#1F2A44" stroke-width="10.5">
      <path d="M250 262 L 224 206"/><path d="M240 268 L 208 214"/><path d="M228 272 L 194 226"/><path d="M216 274 L 186 240"/><path d="M268 246 L 248 206"/>
    </g>
  </g>
  <!-- palms / wrists -->
  <path d="M128 250 C 136 272, 160 284, 190 282 L 200 282 L 210 282 C 240 284, 264 272, 272 250 C 262 266, 236 272, 200 270 C 164 272, 138 266, 128 250 Z" fill="#1F2A44"/>
  <path d="M136 262 C 140 276, 150 286, 166 290 M264 262 C 260 276, 250 286, 234 290" stroke="#C9A961" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1F2A44">Funeral Pictorial</text>
  <text x="200" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5B6476" letter-spacing="4">HELD WITH CARE, SHARED WITH LOVE</text>
</svg>
