  <g fill="#8FA68E"><ellipse cx="306" cy="62" rx="5" ry="2.5" transform="rotate(-30 306 62)"/><ellipse cx="314" cy="61" rx="5" ry="2.5" transform="rotate(-20 314 61)"/><ellipse cx="318" cy="68" rx="5" ry="2.5" transform="rotate(20 318 68)"/></g>
  <text x="340" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#1F2A44">Funeral Pictorial</text>
  <text x="342" y="144" font-family="Georgia, serif" font-size="14" fill="#5B6476" letter-spacing="3.5" font-style="italic">peace, remembered in pictures</text>
