  <path d="M30 178 C 80 180, 120 150, 148 108" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-dasharray="6 6"/>
  <path d="M30 178 C 80 180, 120 150, 148 108" stroke="#1F2A44" stroke-width="4" fill="none"/>
  <!-- dove -->
  <g fill="#1F2A44" transform="translate(50,-90) scale(1.6)">
    <path d="M62 122 C 72 102, 96 94, 120 98 C 127 91, 136 90, 142 96 L 153 99 L 142 103 C 139 113, 128 122, 112 124 C 96 126, 78 132, 62 122 Z"/>
    <path d="M100 101 C 92 84, 100 66, 120 58 C 112 72, 114 86, 126 96 Z"/>
