<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Funeral Pictorial — Eternal Flame</title>
  <defs>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#B8903F"/><stop offset="100%" stop-color="#E8CF8A"/></linearGradient>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#C9A961" stop-opacity="0.5"/><stop offset="100%" stop-color="#C9A961" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="400" fill="#1F2A44"/>
  <circle cx="200" cy="150" r="110" fill="url(#gl)"/>
  <circle cx="200" cy="160" r="104" fill="none" stroke="#C9A961" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="112" fill="none" stroke="#F7F3EC" stroke-width="1" opacity="0.4"/>
  <!-- flame -->
  <path d="M200 70 C 226 104, 240 128, 232 158 C 226 182, 204 192, 196 190 C 212 178, 212 162, 200 146 C 188 160, 178 172, 184 190 C 170 184, 158 166, 162 142 C 166 120, 186 96, 200 70 Z" fill="url(#fl)"/>
  <path d="M200 120 C 210 134, 214 148, 208 160 C 204 168, 196 170, 194 166 C 200 158, 200 148, 194 140 C 190 150, 186 156, 188 164 C 182 156, 182 142, 190 132 C 194 126, 198 124, 200 120 Z" fill="#FFF3CC"/>
  <!-- play triangle as the base / wick holder -->
  <path d="M176 200 L 176 236 L 230 218 Z" fill="#F7F3EC"/>
  <text x="200" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#F7F3EC" letter-spacing="1">Funeral Pictorial</text>
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#C9A961" letter-spacing="5">THEIR LIGHT, STILL PLAYING</text>
</svg>
