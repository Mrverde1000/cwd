<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <title>Funeral Pictorial — Lily &amp; Rose</title>
  <rect width="680" height="220" fill="#FFFFFF"/>
  <!-- oval frame -->
  <ellipse cx="118" cy="110" rx="80" ry="90" fill="#F3F0E8" stroke="#1F2A44" stroke-width="3"/>
  <ellipse cx="118" cy="110" rx="70" ry="80" fill="none" stroke="#C9A961" stroke-width="1"/>
  <!-- stems -->
  <g stroke="#8FA68E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M118 176 C 112 150, 96 128, 86 100"/>
    <path d="M118 176 C 124 150, 140 128, 150 98"/>
    <path d="M118 176 C 118 150, 118 126, 118 92"/>
  </g>
  <!-- leaves -->
  <g fill="#8FA68E">
    <ellipse cx="100" cy="150" rx="14" ry="5" transform="rotate(-40 100 150)"/>
    <ellipse cx="136" cy="150" rx="14" ry="5" transform="rotate(40 136 150)"/>
  </g>
  <!-- calla lilies -->
  <g>
    <path d="M86 100 C 70 84, 76 56, 94 52 C 108 60, 104 88, 86 100 Z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <path d="M88 92 C 90 80, 92 70, 94 60" stroke="#C9A961" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 98 C 166 82, 160 54, 142 50 C 128 58, 132 86, 150 98 Z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <path d="M148 90 C 146 78, 144 68, 142 58" stroke="#C9A961" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- rose in the centre -->
  <g transform="translate(118,82)">
    <circle r="18" fill="#C9A0A0"/>
    <path d="M0 -12 C 8 -10, 10 0, 4 6 C -2 10, -10 4, -8 -4 C -6 -10, -2 -12, 0 -12 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M-14 -6 C -12 6, -4 14, 8 12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M12 -8 C 16 2, 10 14, -2 16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="236" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#1F2A44">Funeral Pictorial</text>
  <text x="238" y="136" font-family="Georgia, serif" font-size="14" fill="#5B6476" letter-spacing="3.5" font-style="italic">memories, lovingly arranged</text>
</svg>
