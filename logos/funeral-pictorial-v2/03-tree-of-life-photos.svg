    <rect x="168" y="94" width="26" height="22" rx="2" fill="#C9A961" transform="rotate(8 181 105)"/>
    <rect x="196" y="88" width="26" height="22" rx="2" fill="#6B8CAE" transform="rotate(-6 209 99)"/>
    <rect x="224" y="98" width="26" height="22" rx="2" fill="#8FA68E" transform="rotate(10 237 109)"/>
    <rect x="246" y="118" width="26" height="22" rx="2" fill="#C9A0A0" transform="rotate(-8 259 129)"/>
    <rect x="134" y="140" width="26" height="22" rx="2" fill="#C9A0A0" transform="rotate(6 147 151)"/>
    <rect x="160" y="124" width="26" height="22" rx="2" fill="#6B8CAE" transform="rotate(-4 173 135)"/>
    <rect x="188" y="116" width="26" height="22" rx="2" fill="#C9A961" transform="rotate(5 201 127)"/>
    <rect x="216" y="124" width="26" height="22" rx="2" fill="#8FA68E" transform="rotate(-9 229 135)"/>
    <rect x="240" y="146" width="26" height="22" rx="2" fill="#6B8CAE" transform="rotate(7 253 157)"/>
    <rect x="154" y="152" width="26" height="22" rx="2" fill="#C9A961" transform="rotate(-7 167 163)"/>
