<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Funeral Pictorial — Tree of Life</title>
  <rect width="400" height="400" fill="#FFFFFF"/>
  <circle cx="200" cy="170" r="128" fill="#F3F0E8" stroke="#1F2A44" stroke-width="3"/>
  <!-- trunk & branches -->
  <g stroke="#1F2A44" stroke-linecap="round" fill="none">
    <path d="M200 266 C 202 240, 200 215, 198 190" stroke-width="9"/>
    <path d="M198 190 C 184 184, 168 170, 160 150" stroke-width="5"/>
    <path d="M198 190 C 214 182, 230 168, 240 148" stroke-width="5"/>
    <path d="M199 192 C 200 170, 202 150, 204 130" stroke-width="5"/>
    <path d="M186 178 C 172 174, 160 166, 150 160" stroke-width="3.5"/>
    <path d="M212 176 C 228 172, 240 166, 250 160" stroke-width="3.5"/>
    <path d="M166 160 C 158 150, 152 140, 150 128" stroke-width="3"/>
    <path d="M234 158 C 244 148, 250 138, 252 126" stroke-width="3"/>
  </g>
