  <text x="200" y="336" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1F2A44">Funeral Pictorial</text>
  <text x="200" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5B6476" letter-spacing="4">A LIFE IN PICTURES</text>
</svg>
