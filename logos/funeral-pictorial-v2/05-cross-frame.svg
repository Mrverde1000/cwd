<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Funeral Pictorial — Cross Frame</title>
  <rect width="400" height="400" fill="#FFFFFF"/>
  <!-- four photo panes separated by a cross -->
  <rect x="112" y="92" width="80" height="80" fill="#E7E0D1"/>
  <rect x="208" y="92" width="80" height="80" fill="#E7E0D1"/>
  <rect x="112" y="188" width="80" height="80" fill="#E7E0D1"/>
  <rect x="208" y="188" width="80" height="80" fill="#E7E0D1"/>
  <!-- little silhouettes inside panes -->
  <circle cx="152" cy="124" r="12" fill="#C9A961"/><path d="M128 172 C 132 150, 172 150, 176 172 Z" fill="#C9A961"/>
  <circle cx="248" cy="124" r="12" fill="#8FA68E"/><path d="M224 172 C 228 150, 268 150, 272 172 Z" fill="#8FA68E"/>
  <circle cx="152" cy="220" r="12" fill="#6B8CAE"/><path d="M128 268 C 132 246, 172 246, 176 268 Z" fill="#6B8CAE"/>
  <circle cx="248" cy="220" r="12" fill="#C9A0A0"/><path d="M224 268 C 228 246, 268 246, 272 268 Z" fill="#C9A0A0"/>
  <!-- cross -->
  <rect x="192" y="68" width="16" height="200" fill="#1F2A44"/>
  <rect x="112" y="172" width="176" height="16" fill="#1F2A44"/>
  <rect x="112" y="92" width="176" height="176" fill="none" stroke="#1F2A44" stroke-width="5"/>
  <!-- gold centre -->
  <circle cx="200" cy="180" r="9" fill="#C9A961"/>
  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1F2A44">Funeral Pictorial</text>
  <text x="200" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5B6476" letter-spacing="4">FAITH • FAMILY • REMEMBRANCE</text>
</svg>
