<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <title>Funeral Pictorial — Butterfly</title>
  <rect width="680" height="220" fill="#FFFFFF"/>
  <g transform="translate(120,110)">
    <!-- wings as photo frames -->
    <g stroke="#1F2A44" stroke-width="3">
      <rect x="-70" y="-62" width="56" height="50" rx="4" fill="#8FA68E" transform="rotate(-18 -42 -37)"/>
      <rect x="14" y="-62" width="56" height="50" rx="4" fill="#C9A961" transform="rotate(18 42 -37)"/>
      <rect x="-60" y="2" width="46" height="44" rx="4" fill="#6B8CAE" transform="rotate(14 -37 24)"/>
      <rect x="14" y="2" width="46" height="44" rx="4" fill="#C9A0A0" transform="rotate(-14 37 24)"/>
    </g>
    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="-42" cy="-40" r="9"/><circle cx="42" cy="-40" r="9"/><circle cx="-37" cy="22" r="7"/><circle cx="37" cy="22" r="7"/>
    </g>
    <!-- body & antennae -->
    <ellipse cx="0" cy="-4" rx="6" ry="38" fill="#1F2A44"/>
    <path d="M-3 -40 C -10 -56, -20 -62, -26 -68 M3 -40 C 10 -56, 20 -62, 26 -68" stroke="#1F2A44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-26" cy="-68" r="2.5" fill="#C9A961"/><circle cx="26" cy="-68" r="2.5" fill="#C9A961"/>
  </g>
  <text x="250" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#1F2A44">Funeral Pictorial</text>
  <text x="252" y="136" font-family="Georgia, serif" font-size="14" fill="#5B6476" letter-spacing="3.5" font-style="italic">a life transformed into memory</text>
</svg>
