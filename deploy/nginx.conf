# nginx config for the Funeral Pictorial static site.
# Serves /about, /contact and /upload without the .html extension and
# redirects any .html request to the clean address.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # /about.html -> /about (permanent)
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Long cache for versioned static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # /about -> about.html, / -> index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Health check for Coolify
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
