# cPanel-style static hosting on Coolify: one folder per domain, plus a web
# file manager to upload and edit the files from a browser.
#
#   /data/sites/<domain>/   <- each website's files (served by Caddy)
#   /data/filebrowser/      <- FileBrowser's users database
#
# In Coolify: New Resource -> Docker Compose -> paste this file.
#   - On the "caddy" service, add EVERY website domain you host, comma separated,
#     e.g. https://site.157.173.212.187.sslip.io,https://funeralpictorial.com
#   - On the "filebrowser" service, set ONE domain for the file manager,
#     e.g. https://files.157.173.212.187.sslip.io
# Coolify's proxy issues the certificates and routes each hostname here.

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_CADDY_80
    volumes:
      - /data/sites:/srv/sites:ro
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        content: |
          {
          	auto_https off
          	admin off
          }
          :80 {
          	@www header_regexp www Host ^www\.(.+)$
          	redir @www https://{re.www.1}{uri} permanent
          	root * /srv/sites/{host}
          	encode gzip zstd
          	@html path_regexp html ^/(.+)\.html$
          	redir @html /{re.html.1} permanent
          	try_files {path} {path}.html {path}/
          	@assets path *.css *.js *.svg *.png *.jpg *.jpeg *.webp *.gif *.ico *.woff *.woff2 *.mp4 *.pdf
          	header @assets Cache-Control "public, max-age=2592000"
          	header -Server
          	file_server
          	respond /healthz "ok" 200
          	handle_errors {
          		@404 expression {err.status_code} == 404
          		handle @404 {
          			rewrite * /404.html
          			file_server
          		}
          	}
          }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser:v2.31.2
    restart: unless-stopped
    user: "0:0"
    environment:
      - SERVICE_FQDN_FILEBROWSER_80
      - FB_ROOT=/srv
      - FB_DATABASE=/database/filebrowser.db
      - FB_PORT=80
      - FB_ADDRESS=0.0.0.0
      - FB_NOAUTH=false
    volumes:
      - /data/sites:/srv
      - /data/filebrowser:/database
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
