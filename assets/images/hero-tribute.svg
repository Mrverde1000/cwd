<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="A television on a stand displaying a memorial slideshow beside flowers and a candle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c38a"/>
      <stop offset="0.55" stop-color="#e58c6a"/>
      <stop offset="1" stop-color="#6a4a6e"/>
    </linearGradient>
    <linearGradient id="screenGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc88a"/>
      <stop offset="1" stop-color="#b8973f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft backdrop shape -->
  <ellipse cx="330" cy="470" rx="290" ry="30" fill="#e6dfd3" opacity="0.7"/>

  <!-- TV body -->
  <rect x="90" y="60" width="460" height="280" rx="14" fill="#0f1620"/>
  <rect x="90" y="60" width="460" height="280" rx="14" fill="none" stroke="#2a3442" stroke-width="2"/>
  <!-- screen -->
  <rect x="104" y="74" width="432" height="252" rx="6" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="420" cy="190" r="46" fill="#fff1c7" opacity="0.95"/>
  <!-- hills -->
  <path d="M104 250 C170 215 230 230 290 215 C350 200 400 240 536 225 L536 326 L104 326 Z" fill="#4e3d5c"/>
  <path d="M104 280 C190 255 260 285 330 268 C410 250 470 290 536 272 L536 326 L104 326 Z" fill="#2f2640"/>
  <!-- two figures on hill -->
  <g fill="#1d1728">
    <circle cx="296" cy="238" r="7"/>
    <path d="M288 246 h16 l4 26 h-24 z"/>
    <circle cx="316" cy="243" r="6"/>
    <path d="M309 250 h14 l3 22 h-20 z"/>
  </g>
  <!-- caption plate -->
  <rect x="104" y="290" width="432" height="36" fill="#000" opacity="0.35"/>
  <text x="320" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff" letter-spacing="1">In Loving Memory</text>
  <!-- gloss -->
  <rect x="104" y="74" width="432" height="252" rx="6" fill="url(#screenGloss)"/>
  <!-- stand -->
  <rect x="300" y="340" width="40" height="40" fill="#1a222e"/>
  <rect x="220" y="378" width="200" height="14" rx="7" fill="#1a222e"/>

  <!-- candle -->
  <g transform="translate(60 300)">
    <circle cx="26" cy="-6" r="36" fill="url(#glow)"/>
    <rect x="12" y="20" width="28" height="100" rx="4" fill="#f4ecdc"/>
    <rect x="12" y="20" width="28" height="8" rx="3" fill="#e6d9bf"/>
    <path d="M26 -14c5 7 10 11 10 18a10 10 0 0 1-20 0c0-7 5-11 10-18z" fill="#f2a53b"/>
    <path d="M26 -2c2 3 4 5 4 8a4 4 0 0 1-8 0c0-3 2-5 4-8z" fill="#fff4cf"/>
    <rect x="25" y="2" width="2" height="18" fill="#3a2a1a"/>
    <ellipse cx="26" cy="124" rx="30" ry="7" fill="#d9d1c3"/>
  </g>

  <!-- flowers (lilies / stems) -->
  <g transform="translate(540 240)">
    <!-- vase -->
    <path d="M20 120 h60 l-8 90 h-44 z" fill="#8ea48c"/>
    <path d="M20 120 h60 l-3 10 h-54 z" fill="#7b9176"/>
    <!-- stems -->
    <g stroke="#5f7a5b" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M50 120 C48 80 40 60 30 30"/>
      <path d="M52 120 C56 85 64 60 76 42"/>
      <path d="M50 120 C50 90 50 70 50 50"/>
    </g>
    <!-- leaves -->
    <path d="M44 95 C30 85 24 90 20 100 C32 104 40 102 44 95z" fill="#7b9176"/>
    <path d="M58 88 C72 80 80 86 84 94 C72 98 64 96 58 88z" fill="#7b9176"/>
    <!-- lily blooms -->
    <g fill="#faf7f2" stroke="#e6dfd3" stroke-width="1.5">
      <path d="M30 30 C14 10 10 6 20 0 C28 10 30 20 30 30z"/>
      <path d="M30 30 C20 8 36 -2 42 4 C38 16 34 24 30 30z"/>
      <path d="M30 30 C44 12 54 16 52 26 C44 28 36 30 30 30z"/>
      <path d="M30 30 C44 40 42 52 34 50 C30 42 30 36 30 30z"/>
      <path d="M30 30 C10 36 4 44 14 46 C22 40 26 34 30 30z"/>
    </g>
    <circle cx="30" cy="30" r="4" fill="#d8a85a"/>
    <g fill="#faf7f2" stroke="#e6dfd3" stroke-width="1.5">
      <path d="M76 42 C64 24 62 20 72 14 C78 24 78 34 76 42z"/>
      <path d="M76 42 C68 22 82 12 88 18 C84 30 80 36 76 42z"/>
      <path d="M76 42 C90 26 100 30 98 40 C90 42 82 44 76 42z"/>
      <path d="M76 42 C88 52 86 62 78 60 C76 52 76 48 76 42z"/>
      <path d="M76 42 C58 48 52 56 62 58 C70 52 74 46 76 42z"/>
    </g>
    <circle cx="76" cy="42" r="4" fill="#d8a85a"/>
    <!-- bud -->
    <path d="M50 50 C44 40 48 30 50 26 C52 30 56 40 50 50z" fill="#f4ecdc" stroke="#e6dfd3" stroke-width="1.5"/>
  </g>

  <!-- small framed photo leaning on stand -->
  <g transform="translate(160 356)">
    <rect x="0" y="0" width="70" height="56" rx="4" fill="url(#goldg)"/>
    <rect x="6" y="6" width="58" height="44" rx="2" fill="#f4ecdc"/>
    <circle cx="35" cy="24" r="9" fill="#c9bfae"/>
    <path d="M14 48 C20 34 50 34 56 48z" fill="#c9bfae"/>
  </g>
</svg>
