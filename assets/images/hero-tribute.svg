<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="A television displaying a memorial slideshow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c38a"/>
      <stop offset="0.55" stop-color="#e58c6a"/>
      <stop offset="1" stop-color="#6a4a6e"/>
    </linearGradient>
    <linearGradient id="screenGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc88a"/>
      <stop offset="1" stop-color="#b8973f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft backdrop shape -->
  <ellipse cx="320" cy="380" rx="260" ry="22" fill="#e6dfd3" opacity="0.7"/>

  <!-- TV body -->
  <rect x="90" y="60" width="460" height="280" rx="14" fill="#0f1620"/>
  <rect x="90" y="60" width="460" height="280" rx="14" fill="none" stroke="#2a3442" stroke-width="2"/>
  <!-- screen -->
  <rect x="104" y="74" width="432" height="252" rx="6" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="420" cy="190" r="46" fill="#fff1c7" opacity="0.95"/>
  <!-- hills -->
  <path d="M104 250 C170 215 230 230 290 215 C350 200 400 240 536 225 L536 326 L104 326 Z" fill="#4e3d5c"/>
  <path d="M104 280 C190 255 260 285 330 268 C410 250 470 290 536 272 L536 326 L104 326 Z" fill="#2f2640"/>
  <!-- two figures on hill -->
  <g fill="#1d1728">
    <circle cx="296" cy="238" r="7"/>
    <path d="M288 246 h16 l4 26 h-24 z"/>
    <circle cx="316" cy="243" r="6"/>
    <path d="M309 250 h14 l3 22 h-20 z"/>
  </g>
  <!-- caption plate -->
  <rect x="104" y="290" width="432" height="36" fill="#000" opacity="0.35"/>
  <text x="320" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff" letter-spacing="1">In Loving Memory</text>
  <!-- gloss -->
  <rect x="104" y="74" width="432" height="252" rx="6" fill="url(#screenGloss)"/>
</svg>
