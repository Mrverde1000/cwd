<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A phone and a stack of printed photos being shared">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcc88a"/><stop offset="1" stop-color="#b8973f"/></linearGradient></defs>
  <ellipse cx="160" cy="178" rx="120" ry="12" fill="#f1ebe1"/>
  <!-- photo stack -->
  <g transform="rotate(-8 110 110)">
    <rect x="50" y="60" width="110" height="86" rx="6" fill="#fff" stroke="#e6dfd3" stroke-width="2"/>
    <rect x="58" y="68" width="94" height="58" fill="#c9d7c6"/>
    <circle cx="130" cy="84" r="8" fill="#fff1c7"/>
    <path d="M58 126 L84 98 L104 116 L120 104 L152 126z" fill="#8ea48c"/>
  </g>
  <g transform="rotate(6 130 120)">
    <rect x="70" y="80" width="110" height="86" rx="6" fill="#fff" stroke="#e6dfd3" stroke-width="2"/>
    <rect x="78" y="88" width="94" height="58" fill="#e9d9c8"/>
    <circle cx="125" cy="112" r="11" fill="#c9bfae"/>
    <path d="M100 146 C106 128 144 128 150 146z" fill="#c9bfae"/>
  </g>
  <!-- phone -->
  <rect x="200" y="30" width="78" height="150" rx="12" fill="#2b3450"/>
  <rect x="207" y="42" width="64" height="126" rx="6" fill="#faf7f2"/>
  <rect x="214" y="52" width="50" height="34" rx="3" fill="#c9d7c6"/>
  <rect x="214" y="92" width="50" height="34" rx="3" fill="#e9d9c8"/>
  <rect x="214" y="132" width="50" height="28" rx="3" fill="#dfe6f0"/>
  <!-- upload arrow -->
  <circle cx="200" cy="60" r="22" fill="url(#g)"/>
  <path d="M200 70 V50 M191 59 L200 50 L209 59" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
